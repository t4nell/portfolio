<section class="sayHiSection" aria-labelledby="sayHiTitle">
  <h2 id="sayHiTitle">Say Hi!</h2>

  <div class="sayHiIntro">
    <p class="sayHiQuestion">Want to discuss a new project?</p>
    <p class="sayHiMessage">Say hello! let's discuss your ideas and make it happen</p>
  </div>

  <form class="contactForm">
    <input class="formField" type="text" name="name" placeholder="Your name" autocomplete="name">
    <input class="formField" type="email" name="email" placeholder="Your email" autocomplete="email">
    <textarea class="formField" name="message" placeholder="Your message" rows="5"></textarea>

    <label class="privacyLabel">
      <input class="privacyCheckbox" type="checkbox" name="privacy">
      <span>
        I've read the <a class="privacyLink" href="#">privacy policy</a>
        and agree to the processing of my data as outlined.
      </span>
    </label>

    <button class="sendButton" type="submit">Send message</button>
  </form>

  <div class="footerContainer">
    <div class="footerArrow">
        <img src="/assets/icons/project/arrowFooter.svg" alt="pfeil">
    </div>
    <div class="footerBrand">
        <img src="/assets/logo/logoWhite.png" alt="Logo">
        <span>© Michel Korfmacher 2026</span>
    </div>
    <div class="footerSocials">
        <a href=""><img src="/assets/icons/social/githubButton.svg" alt="Git Hub"></a>
        <a href=""><img src="/assets/icons/social/emailButton.svg" alt="e-mail"></a>
        <a href=""><img src="/assets/icons/social/linkedinButton.svg" alt="LinkedIn"></a>
    </div>
    <div class="footerLegal"><a href="">Legal notice</a></div>
  </div>

</section>
