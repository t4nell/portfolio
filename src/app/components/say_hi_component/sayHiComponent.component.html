<section class="sayHiSection" id="say-hi" aria-labelledby="sayHiTitle">
  <div class="content-limit sayHiInner">
    <h2 id="sayHiTitle">{{ lang.t().sayHi.title }}</h2>

    <div class="sayHiIntro">
      <p class="sayHiQuestion">{{ lang.t().sayHi.question }}</p>
      <p class="sayHiMessage">{{ lang.t().sayHi.message }}</p>
    </div>

    <form class="contactForm">
      <input
        class="formField"
        type="text"
        name="name"
        [placeholder]="lang.t().sayHi.placeholderName"
        autocomplete="name"
      >
      <input
        class="formField"
        type="email"
        name="email"
        [placeholder]="lang.t().sayHi.placeholderEmail"
        autocomplete="email"
      >
      <textarea
        class="formField"
        name="message"
        [placeholder]="lang.t().sayHi.placeholderMessage"
        rows="5"
      ></textarea>

      <label class="privacyLabel">
        <input class="privacyCheckbox" type="checkbox" name="privacy">
        <span>
          {{ lang.t().sayHi.privacyBefore }}
          <a class="privacyLink" href="/privacy-policy" (click)="onPrivacyClick($event)">
            <span class="privacyLinkText">{{ lang.t().sayHi.privacyLink }}</span>
            <span class="privacyLinkMeasure" aria-hidden="true">{{ lang.t().sayHi.privacyLink }}</span>
          </a>
          {{ lang.t().sayHi.privacyAfter }}
        </span>
      </label>

      <button class="sendButton" type="submit">
        <span class="sendButtonDesktop">{{ lang.t().sayHi.sendDesktop }}</span>
        <span class="sendButtonMobile">{{ lang.t().sayHi.sendMobile }}</span>
      </button>
    </form>

    <app-footer (legalClick)="legalClick.emit()" />
  </div>
</section>
