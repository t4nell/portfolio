<div class="content-limit aboutMeContent">
  <div class="aboutMeTextContainer">

    <div>
        <div>
            <h2>{{ lang.t().about.title }}</h2>
        </div>
        <span>{{ lang.t().about.text }}</span>
    </div>
    <div class="aboutMeFacts">
        <div class="factItem">
            <img src="/assets/icons/project/house.svg" alt="">
            <span>{{ lang.t().about.basedIn }}</span>
        </div>
        <div class="factItem">
            <img src="/assets/icons/project/laptop.svg" alt="">
            <span>{{ lang.t().about.openToWork }}</span>
        </div>
        <div class="buttonContainer">
            <a class="talkButton" href="#say-hi">{{ lang.t().about.letsTalk }}</a>
        </div>
    </div>

  </div>


  <div class="aboutMeImageContainer">
    <img
      class="portrait"
      src="/assets/images/portrait.jpg"
      alt="Portrait von Michel Korfmacher"
    >
  </div>
</div>
