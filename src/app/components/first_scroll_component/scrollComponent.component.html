<div class="arrowContainer">
    <div class="arrowContainerEmail">
        <a [href]="'mailto:' + email()">
        {{ email() }}
        </a>
    </div>

  

    <div class="arrowContainerScroll" aria-hidden="true">
        <span
        class="arrow"
        [class]="'arrow arrow--' + direction()"
        >
        <span class="arrowLine"></span>
        </span>
        <span class="arrowContainerLabel">Scroll<br>Down</span>
    </div>

</div>
