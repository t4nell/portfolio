<div class="arrowContainer">
    <div class="arrowContainerEmail">
        <a [href]="'mailto:' + email()">
        {{ email() }}
        </a>
    </div>

    <div class="arrowContainerScroll" aria-hidden="true">
        <div class="arrowTrack">
            <span
            class="arrow"
            [class]="'arrow arrow--' + direction()"
            >
            <span class="arrowLine"></span>
            </span>
        </div>
        <span class="arrowContainerLabel">{{ lang.t().hero.scrollDown }}<br>{{ lang.t().hero.scrollDownSub }}</span>
    </div>

</div>
