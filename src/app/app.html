<app-header [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()" (logoClick)="goToHero()" />

@if (menuOpen()) {
  <app-menu (navigate)="goToSection($event)" />
}

@if (legalOpen()) {
  <app-legal-notice (backClick)="goToHero()" />
} @else if (privacyOpen()) {
  <app-privacy-policy (backClick)="goToHero()" (legalClick)="openLegal()" />
} @else {
  <app-hero-component />
  <app-about-me-component />
  <app-section-transition-component direction="down-left" />
  <app-skills-component />
  <app-section-transition-component direction="down-right" />
  <app-portfolio-component />
  <app-references-component />
  <app-section-transition-component direction="down-left" class="lastTransition"/>
  <app-say-hi-component (legalClick)="openLegal()" (privacyClick)="openPrivacy()" />
}

<router-outlet />
