<div class="menuContainer">
  <div class="menuLinks">
    <div class="menuLinksInner">
      <a href="#about" (click)="onNavigate($event, 'about')">{{ lang.t().menu.about }}</a>
      <a href="#skills" (click)="onNavigate($event, 'skills')">{{ lang.t().menu.skills }}</a>
      <a href="#portfolio" (click)="onNavigate($event, 'portfolio')">{{ lang.t().menu.portfolio }}</a>
    </div>
  </div>

  <div class="menuContact">
    <div class="menuContactText">
      <a href="#say-hi">{{ lang.t().menu.sayHi }}</a>
      <a [href]="socials.email">michelkorfmacher@yahoo.de</a>
    </div>

    <div class="menuSocials">
      <a [href]="socials.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <img src="/assets/icons/social/githubButton.svg" alt="">
      </a>
      <a [href]="socials.email" aria-label="E-Mail">
        <img src="/assets/icons/social/emailButton.svg" alt="">
      </a>
      <a [href]="socials.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="/assets/icons/social/linkedinButton.svg" alt="">
      </a>
    </div>
  </div>
</div>
