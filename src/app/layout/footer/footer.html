<div class="footerContainer" [class.footerContainer--noArrow]="!showArrow()">
  @if (showArrow()) {
    <div class="footerArrow">
      <a href="#hero" [attr.aria-label]="lang.t().footer.backToTop">
        <img src="/assets/icons/project/arrowFooter.svg" alt="">
      </a>
    </div>
  }
  <div class="footerBrand">
      <img src="/assets/logo/logoWhite.png" alt="Logo">
      <span>© Michel Korfmacher 2026</span>
    </div>
  <div class="footerSocials">
      <a [href]="socials.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <img src="/assets/icons/social/githubButton.svg" alt="Git Hub">
      </a>
      <a [href]="socials.email" aria-label="E-Mail">
        <img src="/assets/icons/social/emailButton.svg" alt="e-mail">
      </a>
      <a [href]="socials.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="/assets/icons/social/linkedinButton.svg" alt="LinkedIn">
      </a>
  </div>
  <div class="footerLegal">
    <a href="/legal-notice" (click)="onLegalClick($event)">{{ lang.t().footer.legal }}</a>
  </div>
</div>
