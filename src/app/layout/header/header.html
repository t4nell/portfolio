<header class="header">
  <div class="header__inner content-limit">
    <a
      class="header__logo-link"
      href="#hero"
      [attr.aria-label]="lang.t().header.homeAria"
      (click)="onLogoClick($event)"
    >
      <img
        class="header__logo"
        ngSrc="/assets/logo/logoBlack.png"
        width="520"
        height="310"
        priority
        alt="MK Logo"
      >
    </a>

    <div class="header__actions">
      <div class="language-switch" [attr.aria-label]="lang.t().header.langAria">
        <button
          class="language-switch__option"
          [class.language-switch__option--active]="lang.lang() === 'en'"
          type="button"
          [attr.aria-pressed]="lang.lang() === 'en'"
          (click)="setLang('en')"
        >
          EN
        </button>
        <button
          class="language-switch__option"
          [class.language-switch__option--active]="lang.lang() === 'de'"
          type="button"
          [attr.aria-pressed]="lang.lang() === 'de'"
          (click)="setLang('de')"
        >
          DE
        </button>
      </div>

      <button
        class="menu-button"
        [class.menu-button--open]="menuOpen()"
        type="button"
        [attr.aria-label]="menuOpen() ? lang.t().header.menuClose : lang.t().header.menuOpen"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuToggle.emit()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
