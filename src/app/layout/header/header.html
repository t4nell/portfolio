<header class="header">
  <div class="header__inner content-wrapper">
    <a class="header__logo-link" href="/" aria-label="Zur Startseite">
      <img
        class="header__logo"
        ngSrc="/assets/logo/logoBlack.png"
        width="520"
        height="310"
        priority
        alt="MK Logo"
      >
    </a>

    <div class="header__actions">
      <div class="language-switch" aria-label="Sprache auswählen">
        <button class="language-switch__option language-switch__option--active" type="button" aria-pressed="true">
          EN
        </button>
        <button class="language-switch__option" type="button" aria-pressed="false">
          DE
        </button>
      </div>

      <button class="menu-button" type="button" aria-label="Menü öffnen" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
